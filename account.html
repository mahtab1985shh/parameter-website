.parameter-system-entry{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:11px 18px;margin:8px 12px 8px 0;background:#fff;color:#6855e8;border:1px solid #6855e8;border-radius:10px;text-decoration:none;font-size:13px;font-weight:600}.parameter-system-entry:hover{background:#f2efff}.parameter-system-entry:focus-visible{outline:3px solid #8b77ef;outline-offset:3px}
</style><body><aside><span class="mahan-brand"><img src="media-mahan-logo-sidebar.svg" alt="ماهان وب گستر آویژه" width="940" height="160"></span><div class="sidebar-user"><div><strong data-user-name>مهتاب شجاعی</strong></div></div><nav class="nav" aria-label="حساب کاربری"><button data-view="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z"/></svg><span>داشبورد</span></button><section class="menu-section" aria-labelledby="menu-enterprise"><h2 id="menu-enterprise"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21V5h10v16 M14 10h6v11 M8 9h2 M8 13h2 M8 17h2 M2 21h20"/></svg><span>پارامتر سازمانی</span></h2><div class="menu-children"><button data-view="enterprise-buy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h3l2.5 12h11L21 7H6 M8 19h.01 M18 19h.01"/><circle cx="8" cy="19" r="1"/><circle cx="18" cy="19" r="1"/></svg><span>خرید اشتراک</span></button><button data-view="enterprise-orders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2Z M9 8h6 M9 12h6"/></svg><span>لیست سفارشات</span></button></div></section><section class="menu-section" aria-labelledby="menu-cloud"><h2 id="menu-cloud"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18a5 5 0 1 1 0-10 6 6 0 0 1 11-1 5.5 5.5 0 0 1 0 11Z"/></svg><span>پارامتر ابری</span></h2><div class="menu-children"><button data-view="cloud-buy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h3l2.5 12h11L21 7H6 M8 19h.01 M18 19h.01"/><circle cx="8" cy="19" r="1"/><circle cx="18" cy="19" r="1"/></svg><span>خرید اشتراک</span></button><button data-view="cloud-orders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2Z M9 8h6 M9 12h6"/></svg><span>لیست سفارشات</span></button></div></section><section class="menu-section" aria-labelledby="menu-finance"><h2 id="menu-finance"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18v14H3z M3 6V4h15 M16 11h5v5h-5z"/></svg><span>مالی</span></h2><div class="menu-children"><button data-view="transactions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h15l-4-4 M20 17H5l4 4"/></svg><span>لیست تراکنش‌ها</span></button><button data-view="invoices"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2Z M9 8h6 M9 12h6"/></svg><span>لیست فاکتورها</span></button></div></section><section class="menu-section profile-menu" aria-labelledby="menu-profile"><h2 id="menu-profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0 M4 21v-2a8 8 0 0 1 16 0v2"/></svg><span>پروفایل کاربر</span></h2><div class="menu-children"><button data-view="profile-individual"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0 M4 21v-2a8 8 0 0 1 16 0v2"/></svg><span>شخص حقیقی</span></button><button data-view="profile-legal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21V3h12v18 M16 9h4v12 M8 7h4 M8 11h4 M8 15h4 M2 21h20"/></svg><span>شخص حقوقی</span></button></div></section></nav><a class="exit" id="exit" target="_top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4H4v16h5 M10 12h11l-4-4 M21 12l-4 4"/></svg><span>خروج از حساب</span></a></aside><main class="main"><div id="content"></div></main><dialog id="account-dialog" aria-label="جزئیات سرویس"></dialog><div class="toast" role="status" hidden></div><script>

function orderDetailsMarkup(trigger){
 const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const cells=Array.from(trigger.closest('tr')?.cells||[],cell=>cell.textContent.trim());
 const number=trigger.dataset.orderNumber||'۱۰۰۱',date=cells[6]||'۱۴۰۵/۰۷/۱۱',product=cells[1]||'پارامتر ابری';
 const field=(label,value)=>'<div><dt>'+label+'</dt><dd>'+esc(value)+'</dd></div>';
 const section=(title,body,cls='')=>'<section class="od-section '+cls+'"><h3>'+title+'</h3>'+body+'</section>';
 const buyer=section('مشخصات خریدار · حقیقی','<dl class="od-fields">'+field('نام','مهتاب')+field('نام خانوادگی','شجاعی')+field('کد ملی','—')+'</dl>');
 const plan=section('جزئیات پلن','<dl class="od-fields">'+field('محصول',product)+field('سرویس',cells[2]||'پایه')+field('تعداد کاربر',cells[4]||'۱')+field('تاریخ شروع',date)+field('تاریخ پایان','—')+field('مدت اعتبار',cells[8]||'۳۵۲ روز')+field('فضای ذخیره‌سازی','۵ گیگابایت')+'</dl><div class="od-subtotal"><span>مبلغ اشتراک سالانه</span><strong>رایگان</strong></div>');
 const extras=section('خدمات مازاد','<dl class="od-fields">'+field('کاربر اضافه','۰')+field('فضای اضافه','۰ گیگابایت')+'</dl><div class="od-subtotal"><span>مبلغ خدمات مازاد</span><strong>۰ ریال</strong></div>');
 const payment=section('جزئیات پرداخت','<dl class="od-payment">'+field('مبلغ اشتراک','۰ ریال')+field('خدمات مازاد','۰ ریال')+field('کد تخفیف','—')+field('درصد تخفیف','۰٪')+field('مبلغ تخفیف','۰ ریال')+field('مبلغ پس از تخفیف','۰ ریال')+field('مالیات و عوارض ارزش افزوده','۰ ریال')+'</dl><div class="od-total"><span>مبلغ کل</span><strong>۰ <small>ریال</small></strong></div>','od-payment-card');
 return '<div class="order-detail"><div class="od-top"><div><span class="od-eyebrow">'+esc(product)+' · خرید</span><h2 id="order-detail-title">جزئیات سفارش <b>'+esc(number)+'</b></h2></div><button class="dialog-close" type="button" aria-label="بستن جزئیات سفارش">بستن ×</button></div><div class="od-meta"><span>تاریخ سفارش <b>'+esc(date)+'</b></span><span class="status-success">✓ پرداخت موفق</span></div>'+orderDetailTabs(buyer,plan,extras,payment)+'</div>';
}


function orderActivationList(){
 const codes=Array.from({length:12},(_,i)=>'DEMO-'+String(i+1).padStart(3,'0')+'-a3JTkLYlQuHUkZh5g0ryVAPSsm6vvYESiUlkfnhH4zvwswrm0p6niBDfB7eB3CUEi9uwR3bSfmWv9yBzL2Xppw696TkIaJpuDjPoDph9gNMpG6FxS9Q6y0CSmTclk8EcezUNirYbDP66xM2SBkdu38G6E6fCloSq1aXhSOgj7EGE5Qtg4s2VW3BkA6PbKp5MAd8UVVpUYVOMmNAxH65VfOonSMuyOsJFPw06icCtXcNQ69DdxPMXN8vZXxMmfrnIAAjS2wF5InXA=');
 return '<div class="od-license-list">'+codes.map((value,i)=>'<article class="od-license"><div class="od-license-heading"><div><b>کد '+(i+1).toLocaleString('fa-IR')+'</b><span class="od-tag">'+(i===0?'پلن پایه':'کاربر مازاد')+'</span></div><button type="button" class="od-copy" data-copy-code="license-'+i+'" aria-label="کپی کد فعال‌سازی '+(i+1)+'">کپی کد ⧉</button></div><code id="license-'+i+'" class="od-license-code" dir="ltr">'+value+'</code></article>').join('')+'</div>';
}
function orderDetailTabs(buyer,plan,extras,payment){
 return '<div class="od-tabs" role="tablist" aria-label="جزئیات سفارش"><button id="od-tab-overview" role="tab" aria-selected="true" aria-controls="od-panel-overview" data-order-tab="overview">مشخصات سفارش</button><button id="od-tab-payment" role="tab" aria-selected="false" tabindex="-1" aria-controls="od-panel-payment" data-order-tab="payment">ریز پرداخت</button><button id="od-tab-activation" role="tab" aria-selected="false" tabindex="-1" aria-controls="od-panel-activation" data-order-tab="activation">کدهای فعال‌سازی <span>۱۲</span></button></div><div class="od-panel" id="od-panel-overview" role="tabpanel" tabindex="0" aria-labelledby="od-tab-overview"><div class="od-overview">'+buyer+plan+extras+'</div></div><div class="od-panel" id="od-panel-payment" role="tabpanel" tabindex="0" aria-labelledby="od-tab-payment" hidden>'+payment+'</div><div class="od-panel" id="od-panel-activation" role="tabpanel" tabindex="0" aria-labelledby="od-tab-activation" hidden><section class="od-section od-shared-account"><h3>اطلاعات ورود</h3><div class="od-license-account"><span>نام کاربری ادمین : <b dir="ltr">admin01</b></span><label>رمز عبور : <input type="password" readonly value="DemoPass1!" aria-label="رمز عبور مشترک ادمین"></label><button type="button" class="od-reveal" aria-pressed="false">نمایش رمز</button></div></section><div class="od-license-tools"><label><span class="sr-only">جستجوی کد فعال‌سازی</span><input type="search" data-license-search placeholder="جستجوی کد فعال‌سازی…"></label><small>کدهای نمایشی · غیرفعال</small></div>'+orderActivationList()+'<p class="od-no-results" hidden>کدی پیدا نشد.</p></div>';
}
function selectOrderTab(tab){
 const root=tab.closest('.order-detail');
 root.querySelectorAll('[data-order-tab]').forEach(button=>{const selected=button===tab;button.setAttribute('aria-selected',String(selected));button.tabIndex=selected?0:-1;root.querySelector('#'+button.getAttribute('aria-controls')).hidden=!selected});
}
 document.addEventListener('click',async event=>{
 const tab=event.target.closest('[data-order-tab]');if(tab){selectOrderTab(tab);return}
 const reveal=event.target.closest('.od-reveal');if(reveal){const input=reveal.closest('.od-license-account').querySelector('input');const visible=input.type==='password';input.type=visible?'text':'password';reveal.textContent=visible?'پنهان کردن':'نمایش رمز';reveal.setAttribute('aria-pressed',String(visible));return}
 const copy=event.target.closest('[data-copy-code]');if(!copy)return;
 const value=document.getElementById(copy.dataset.copyCode).textContent;
 try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(value)}else{throw Error('clipboard unavailable')}}catch{
 const textarea=document.createElement('textarea');textarea.value=value;textarea.style.cssText='position:fixed;opacity:0';copy.closest('dialog').append(textarea);textarea.select();const done=document.execCommand('copy');textarea.remove();copy.focus();if(!done){toast('کپی انجام نشد؛ کد را انتخاب و کپی کنید.');return}
 }
 copy.textContent='کپی شد ✓';toast('کد فعال‌سازی کپی شد.');setTimeout(()=>{copy.textContent='کپی کد ⧉'},1800);
 });
 document.addEventListener('keydown',event=>{const tab=event.target.closest('[data-order-tab]');if(!tab||!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;event.preventDefault();const tabs=Array.from(tab.parentElement.querySelectorAll('[data-order-tab]'));const index=tabs.indexOf(tab);const next=event.key==='Home'?0:event.key==='End'?tabs.length-1:(index+(event.key==='ArrowLeft'?1:-1)+tabs.length)%tabs.length;selectOrderTab(tabs[next]);tabs[next].focus()});
 document.addEventListener('input',event=>{if(!event.target.matches('[data-license-search]'))return;const panel=event.target.closest('.od-panel');const query=event.target.value.trim().toLowerCase();let count=0;panel.querySelectorAll('.od-license').forEach(row=>{row.hidden=!row.textContent.toLowerCase().includes(query);if(!row.hidden)count++});panel.querySelector('.od-no-results').hidden=count>0});

const content=document.getElementById('content');
const button=(title,view)=>'<button class="primary" data-view="'+view+'">'+title+' ←</button>';
const empty=(title,copy,action='')=>'<div class="card empty"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18H6z M9 8h6 M9 12h6 M9 16h3"/></svg></span><h2>'+title+'</h2><p>'+copy+'</p>'+action+'</div>';
function orders(type){return '<h1>سفارشات '+type+'</h1><p class="muted">وضعیت درخواست‌ها و خریدهای شما</p><div class="card tablewrap"><table class="table"><thead><tr><th>شماره سفارش</th><th>سرویس</th><th>تاریخ</th><th>مبلغ</th><th>وضعیت</th></tr></thead><tbody><tr><td colspan="5" style="text-align:center">هنوز سفارشی ثبت نشده است.</td></tr></tbody></table></div>'}
const pages={dashboard:()=>'<div class="welcome"><div><span class="badge">حساب کاربری ماهان وب گستر آویژه</span><h1>اشتراک شما، شروع یک مدیریت یکپارچه</h1><p>اشتراک‌ها، سفارش‌ها و اطلاعات حساب خود را از همین‌جا مدیریت کنید.</p>'+button('انتخاب اشتراک','cloud-buy')+'<a class="parameter-system-entry" href="https://parameter.mahanwga.com/" target="_blank" rel="noopener noreferrer">ورود با سامانه پارامتر <span aria-hidden="true">↗</span></a></div><div class="welcome-brand"><span class="mahan-brand"><img src="media-mahan-logo.svg" alt="ماهان وب گستر آویژه" width="940" height="160"></span><span>همراه شما، از شروع تا توسعه</span></div></div><div class="grid"><div class="card">اشتراک فعال<span class="stat">۰</span><small class="muted">هنوز سرویسی فعال نشده</small></div><div class="card">سفارش‌های ثبت‌شده<span class="stat">۰</span><small class="muted">سازمانی و ابری</small></div><div class="card">صورتحساب پرداخت‌نشده<span class="stat">۰</span><small class="muted">موردی برای پرداخت ندارید</small></div></div><h2 class="edition-title">محصولات شرکت ماهان وب گستر آویژه</h2><div class="two edition-options"><article class="card"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21V3h12v18 M16 9h4v12 M8 7h4 M8 11h4 M8 15h4 M2 21h20"/></svg></span><h2>پارامتر سازمانی</h2><p>برای سازمان‌ها و مدیریت سبد پروژه‌ها، با استقرار روی زیرساخت اختصاصی.</p>'+button('بررسی نسخه سازمانی','enterprise-buy')+'</article><article class="card"><span class="icon green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 18a5 5 0 0 1-1-10 7 7 0 0 1 13-1 5 5 0 0 1 0 11H6z"/></svg></span><h2>پارامتر ابری</h2><p>برای تیم‌های کوچک، بدون نیاز به خرید و نگهداری سرور.</p>'+button('انتخاب نسخه ابری','cloud-buy')+'</article></div>',
'enterprise-buy':()=>'<h1>خرید اشتراک سازمانی</h1><p class="muted">راهکار متناسب با ساختار سازمان شما</p><div class="two"><article class="card"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21V3h12v18 M16 9h4v12 M8 7h4 M8 11h4 M8 15h4 M2 21h20"/></svg></span><h2>پارامتر سازمانی</h2><ul><li>استقرار روی سرور اختصاصی سازمان</li><li>تعریف شعب و دسترسی چندلایه</li><li>گزارش‌های تجمیعی سبد پروژه‌ها</li></ul><p>هزینه و شرایط پس از بررسی نیاز سازمان مشخص می‌شود.</p></article><form class="card form" data-form="quote"><label>نام سازمان<input required autocomplete="organization"></label><label>شماره تماس<input required type="tel" autocomplete="tel"></label><label class="wide">تعداد کاربران موردنیاز<input type="number" min="1" required></label><button class="primary wide">درخواست پیش‌فاکتور</button></form></div>',
'cloud-buy':()=>'<h1>خرید اشتراک ابری</h1><p class="muted">سرویس متناسب با تیم خود را انتخاب کنید</p><div class="two"><div class="card"><span class="icon green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 18a5 5 0 0 1-1-10 7 7 0 0 1 13-1 5 5 0 0 1 0 11H6z"/></svg></span><h2>همکاری آنلاین، بدون سرور اختصاصی</h2><p>برای تیم‌های کوچک تا ۱۰ نفر؛ مدیریت مشترک اطلاعات و اسناد پروژه.</p><ul><li>دسترسی تحت وب</li><li>زیرساخت و پشتیبان‌گیری توسط ماهان</li><li>مدیریت اشتراک از حساب کاربری</li></ul></div><form class="card form" data-form="cloud"><label>مدت اشتراک<select><option>ماهانه</option><option>سالانه</option></select></label><label>تعداد کاربران<input type="number" min="1" max="10" value="3" required></label><div class="wide"><h2>قیمت در مرحلهٔ اتصال سرویس نمایش داده می‌شود</h2><p>در این پیش‌نمایش پرداخت انجام نمی‌شود.</p></div><button class="primary wide">بررسی سفارش</button></form></div>',

function tablePage(title,headers,cells){
 const fa=value=>String(value).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
 const rows=Array.from({length:10},(_,index)=>'<tr>'+cells.map((cell,column)=>{
  const heading=headers[column];
  if(heading==='ردیف')cell=fa(index+1);
  if(heading==='شماره سفارش')cell=fa(1001+index);
  if(heading==='شماره فاکتور')cell=fa(1405001+index);
  if(heading==='شماره ارجاع')cell=fa(14051001+index);
  if(heading==='تاریخ سفارش'||heading==='تاریخ فاکتور')cell='۱۴۰۵/۰۷/'+fa(11+index);
  if(heading==='جزئیات')cell=cell.replace('data-detail="order"','data-detail="order" data-order-number="'+fa(1001+index)+'"');
  return '<td>'+cell+'</td>';
 }).join('')+'</tr>').join('');
 return '<h1>'+title+'</h1><p class="table-sample-caption">۱۰ ردیف نمونه برای نمایش جدول</p><div class="card tablewrap detailed-table"><table class="table"><thead><tr>'+headers.map(h=>'<th scope="col">'+h+'</th>').join('')+'</tr></thead><tbody>'+rows+'</tbody></table></div>';
}

const enterpriseDraft = {type:'',individual:{},legal:{},invoice:{}};
const purchaseEscape = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function buyerField(name,label,extra='') {
 const value=profiles[enterpriseDraft.type][name] ?? '';
 return `<label>${label}<input name="${name}" value="${purchaseEscape(value)}" readonly placeholder="در پروفایل تکمیل نشده" ${extra}></label>`;
}
function buyerProfileComplete(){
 const fields=enterpriseDraft.type==='individual'?['first','last','national']:['company','legalId','registration','economic'];
 return fields.every(name=>String(profiles[enterpriseDraft.type]?.[name]??'').trim());
}
function invoiceAmount(label){return `<label>${label}<input value="—" readonly aria-label="${label}؛ پس از تعیین تعرفه"></label>`;}
pages['enterprise-buy']=()=>`<div class="enterprise-purchase"><h1>خرید اشتراک سازمانی</h1><p class="purchase-lead">فاکتور خرید به نام چه کسی صادر شود؟</p>
<fieldset class="buyer-choice"><legend>نوع خریدار</legend>${[['individual','شخص حقیقی','صدور فاکتور به نام فرد','M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8 M4 21v-2a8 8 0 0 1 16 0v2'],['legal','شخص حقوقی','صدور فاکتور به نام شرکت یا سازمان','M4 21V3h12v18 M16 9h4v12 M8 7h4 M8 11h4 M8 15h4 M2 21h20']].map(([value,title,description,path])=>`<label class="buyer-option"><input type="radio" name="invoice-buyer" value="${value}" ${enterpriseDraft.type===value?'checked':''}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="${path}"/></svg><span><b>${title}</b><small>${description}</small></span></label>`).join('')}</fieldset>
${enterpriseDraft.type?`<form data-form="enterprise-purchase" class="purchase-form"><fieldset><legend>مشخصات خریدار</legend><div class="purchase-fields">${enterpriseDraft.type==='individual'?buyerField('first','نام','autocomplete="given-name"')+buyerField('last','نام خانوادگی','autocomplete="family-name"')+buyerField('national','کد ملی','inputmode="numeric" pattern="[0-9۰-۹٠-٩]{10}" maxlength="10" title="کد ملی ۱۰ رقمی"'):buyerField('company','نام شرکت / سازمان','autocomplete="organization"')+buyerField('legalId','شناسه ملی','inputmode="numeric" pattern="[0-9۰-۹٠-٩]{11}" maxlength="11" title="شناسه ملی ۱۱ رقمی"')+buyerField('registration','شماره ثبت','inputmode="numeric"')+buyerField('economic','کد اقتصادی','inputmode="numeric"')}</div></fieldset>
<fieldset><legend>جزئیات فاکتور خرید · محصول پارامتر</legend><div class="purchase-fields"><label>نام کارفرما <span class="required">*</span><input name="employer" required placeholder="نام کارفرما را وارد کنید" value="${purchaseEscape(enterpriseDraft.invoice.employer)}"></label><label>تعداد کاربر <span class="required">*</span><input name="users" type="number" min="1" step="1" required value="${purchaseEscape(enterpriseDraft.invoice.users||'1')}"></label>${invoiceAmount('بهای واحد (ریال)')}<label>کد تخفیف<input name="discount" placeholder="در صورت داشتن کد تخفیف" value="${purchaseEscape(enterpriseDraft.invoice.discount)}"></label>${invoiceAmount('درصد تخفیف')}${invoiceAmount('مبلغ تخفیف (ریال)')}${invoiceAmount('قیمت کل (ریال)')}${invoiceAmount('کل مبلغ با تخفیف (ریال)')}${invoiceAmount('عوارض و مالیات بر ارزش افزوده (ریال)')}</div><div class="purchase-total">${invoiceAmount('کل مبلغ قابل پرداخت (ریال)')}</div><p class="purchase-price-note">مبلغ نهایی پس از تعیین تعرفهٔ سازمانی نمایش داده می‌شود.</p></fieldset>
<div class="purchase-consent"><label><input type="checkbox" name="terms" required ${enterpriseDraft.invoice.terms?'checked':''}> با شرایط و قوانین موافقم</label><button type="button" class="purchase-terms-link" data-open-terms aria-haspopup="dialog" aria-controls="purchase-terms-dialog">مشاهده قوانین و مقررات</button></div><div class="purchase-actions"><button type="button" class="secondary" data-purchase-back>بازگشت به انتخاب خریدار</button><button class="primary" type="submit">ثبت سفارش</button></div><p class="purchase-feedback" role="status"></p></form>`:'<div class="purchase-start"><span aria-hidden="true">↑</span><p>برای نمایش فرم خرید، ابتدا نوع خریدار را انتخاب کنید.</p></div>'}</div>`;
document.addEventListener('change',event=>{
 if(event.target.name==='invoice-buyer') {enterpriseDraft.type=event.target.value;enterpriseDraft.invoice.terms=false;render('enterprise-buy');}
});
document.addEventListener('input',event=>{
 const field=event.target;
 if(!field.closest('[data-form="enterprise-purchase"]'))return;
 if(!['employer','users','discount','terms'].includes(field.name))return;
 enterpriseDraft.invoice[field.name]=field.type==='checkbox'?field.checked:field.value;
});
document.addEventListener('click',event=>{if(event.target.closest('[data-purchase-back]')){enterpriseDraft.type='';render('enterprise-buy');}});
document.addEventListener('submit',event=>{
 if(event.target.dataset.form!=='enterprise-purchase')return;
 event.preventDefault();
 if(!buyerProfileComplete()){
  event.target.querySelector('.purchase-feedback').textContent='ابتدا مشخصات خریدار را در پروفایل تکمیل و ذخیره کنید.';
  return;
 }

const purchaseTermsMarkup = "<dialog id=\"purchase-terms-dialog\" aria-labelledby=\"purchase-terms-title\">\n<div class=\"terms-shell\">\n<header class=\"terms-header\"><h2 id=\"purchase-terms-title\" tabindex=\"-1\">قوانین و مقررات خرید اشتراک سامانه پارامتر</h2><button type=\"button\" data-close-terms aria-label=\"بستن قوانین و مقررات\">×</button></header>\n<div class=\"terms-body\" tabindex=\"0\" role=\"region\" aria-label=\"متن قوانین و مقررات\">\n<p class=\"terms-intro\">لطفاً پیش از پرداخت، موارد زیر را با دقت مطالعه کنید. ثبت سفارش به معنی پذیرش کامل این قوانین است.</p>\n<section><h3>۱. عضویت و تکمیل پروفایل</h3>\n<p>برای استفاده از سامانه پارامتر، کاربر موظف است اطلاعات حساب کاربری خود را به‌صورت صحیح و کامل وارد کند.</p>\n<p>مسئولیت صحت اطلاعات (نام، ایمیل، شماره موبایل، اطلاعات سازمانی و...) بر عهده کاربر است.</p>\n<p>در صورت وارد کردن اطلاعات نادرست، شرکت حق دارد دسترسی کاربر را معلق یا محدود کند.</p></section>\n<section><h3>۲. قوانین پرداخت و اشتراک</h3>\n<p>خرید اشتراک به‌صورت آنلاین انجام شده و صدور کد رهگیری پس از پرداخت موفق انجام می‌شود.</p>\n<p>اشتراک خریداری‌شده مربوط به همان حساب کاربری است و قابل انتقال به شخص یا سازمان دیگر نیست.</p>\n<p>مدت اشتراک از لحظه فعال‌سازی آغاز شده و تا پایان همان دوره معتبر است.</p>\n<p>در صورت عدم تمدید، دسترسی کاربر به پنل محدود شده و برخی امکانات مسدود می‌شود.</p></section>\n<section><h3>۳. قوانین لغو اشتراک و بازگشت وجه</h3>\n<p>مطابق عرف و قوانین ایران:</p>\n<p>پس از فعال‌سازی اشتراک، امکان استرداد وجه وجود ندارد مگر در موارد خاص و با تشخیص شرکت.</p></section>\n<section><h3>۴. تعهدات کاربر</h3>\n<p>کاربر متعهد می‌شود:</p>\n<p>از سامانه فقط در چهارچوب قوانین کشور جمهوری اسلامی ایران استفاده کند.</p>\n<p>از بارگذاری اطلاعات خلاف قوانین یا متعلق به دیگران خودداری کند.</p>\n<p>از انجام هرگونه تخریب، نفوذ، تست امنیت یا ایجاد اختلال در عملکرد سامانه بپرهیزد.</p></section>\n<section><h3>۵. تعهدات شرکت ماهان وب گستر آویژه</h3>\n<p>شرکت متعهد می‌شود:</p>\n<p>سامانه را در دسترس کاربر قرار داده و در صورت بروز اختلال، نسبت به رفع آن اقدام کند.</p>\n<p>از اطلاعات کاربر مطابق سیاست حریم خصوصی محافظت نماید.</p>\n<p>در صورت ایجاد تغییرات اساسی در امکانات یا قیمت‌ها، این موضوع را به کاربران اطلاع دهد.</p>\n<p>اطلاعات کاربران را بدون حکم قانونی در اختیار شخص یا سازمان دیگری قرار ندهد.</p></section>\n<section><h3>۶. حریم خصوصی و نگهداری داده‌ها</h3>\n<p>اطلاعات واردشده توسط کاربر در سرورهای امن نگهداری می‌شود.</p>\n<p>شرکت متعهد می‌شود اطلاعات کاربران را محرمانه نگه دارد.</p>\n<p>بارگذاری هرگونه اطلاعات حساس سازمانی با مسئولیت کاربر انجام می‌شود.</p>\n<p>کاربر اجازه می‌دهد سامانه برای ارائه خدمات بهتر از داده‌ها به‌صورت تحلیلی و آماری استفاده کند (بدون نمایش اطلاعات شخصی).</p></section>\n<section><h3>۷. مسئولیت‌ها و محدودیت‌ها</h3>\n<p>سامانه پارامتر مسئولیتی در قبال خسارات ناشی از سوءاستفاده کاربر، ورود اطلاعات نادرست یا اختلالات خارج از کنترل شرکت (قطعی اینترنت، مشکلات سراسری شبکه و…) ندارد.</p>\n<p>سامانه ممکن است در برخی زمان‌ها برای بروزرسانی یا تعمیرات از دسترس خارج شود؛ این موضوع به معنی نقض تعهدات شرکت نیست.</p>\n<p>دسترسی کاربر که قوانین را رعایت نکند می‌تواند بدون بازپرداخت مسدود شود.</p></section>\n<section><h3>۸. تغییرات قوانین</h3>\n<p>این قوانین ممکن است با توجه به نیازهای سامانه به‌روزرسانی شود.</p>\n<p>ادامه استفاده از سامانه به معنی پذیرش نسخه جدید قوانین خواهد بود.</p></section>\n<section><h3>۹. حل اختلاف</h3>\n<p>هرگونه اختلاف طبق قوانین جمهوری اسلامی ایران و در مراجع قانونی رسیدگی می‌شود.</p>\n<p>در همه موارد، تلاش شرکت بر حل اختلاف از طریق مذاکره و پشتیبانی است.</p></section>\n</div>\n<footer class=\"terms-footer\"><button type=\"button\" class=\"secondary\" data-close-terms>بستن و بازگشت به فرم</button></footer>\n</div></dialog>\n";

const cloudDraft={plan:0,type:'',users:0,storage:0,discount:'',terms:false};
const cloudMoney=n=>new Intl.NumberFormat('fa-IR').format(n);
const cloudBase=()=>Number(subscriptionPlans[cloudDraft.plan].price.replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[^0-9]/g,''))||0;
const cloudExtras=(users=cloudDraft.users,storage=cloudDraft.storage)=>users*47808+storage*9562;
const cloudRead=(label,value)=>`<label>${label}<input readonly value="${purchaseEscape(value)}"></label>`;
function cloudBuyer(name,label){return cloudRead(label,profiles[cloudDraft.type]?.[name]||'در پروفایل تکمیل نشده');}
const cloudPlanList=pages['cloud-buy'];
pages['cloud-buy']=()=>{let index=0;return cloudPlanList().replace(/<a\s+class="solid plan-buy"[^>]*>[\s\S]*?<\/a>/g,()=>`<button type="button" class="solid plan-buy" data-cloud-plan="${index++}">انتخاب پلن ←</button>`);};
pages['cloud-checkout']=()=>{
 const p=subscriptionPlans[cloudDraft.plan];
 return `<div class="enterprise-purchase cloud-checkout"><h1>خرید اشتراک ابری</h1><section class="selected-cloud-plan"><div><small>پلن منتخب شما</small><h2>${p.name}</h2><p>${p.users} کاربر · ${p.storage} گیگابایت · یک سال اعتبار</p></div><div><strong>${p.price}${cloudDraft.plan?' ریال':''}</strong><button type="button" class="link-button" data-view="cloud-buy">تغییر پلن</button></div></section><p class="purchase-lead">فاکتور خرید به نام چه کسی صادر شود؟</p><fieldset class="buyer-choice"><legend>نوع خریدار</legend>${[['individual','شخص حقیقی'],['legal','شخص حقوقی']].map(([value,label])=>`<label class="buyer-option"><input type="radio" name="cloud-buyer" value="${value}" ${cloudDraft.type===value?'checked':''}><b>${label}</b></label>`).join('')}</fieldset>${cloudDraft.type?`<form class="purchase-form" data-form="cloud-checkout"><fieldset><legend>مشخصات خریدار</legend><div class="purchase-fields">${cloudDraft.type==='individual'?cloudBuyer('first','نام')+cloudBuyer('last','نام خانوادگی')+cloudBuyer('national','کد ملی'):cloudBuyer('company','نام شرکت / سازمان')+cloudBuyer('legalId','شناسه ملی')+cloudBuyer('registration','شماره ثبت')+cloudBuyer('economic','کد اقتصادی')}</div></fieldset><fieldset><legend>جزئیات فاکتور · پارامتر ابری</legend><div class="purchase-fields">${cloudRead('نام سرویس',p.name)}${cloudRead('تعداد کاربران پلن',p.users)}${cloudRead('فضای ذخیره‌سازی پلن (گیگابایت)',p.storage)}${cloudRead('مدت اعتبار','یک سال')}${cloudRead('بهای پلن (ریال)',cloudMoney(cloudBase()))}<label>کد تخفیف<input name="cloud-discount" value="${purchaseEscape(cloudDraft.discount)}" placeholder="در صورت داشتن کد تخفیف"></label></div></fieldset><fieldset><legend>خدمات اضافه</legend><div class="cloud-extras-summary"><p>${cloudMoney(cloudDraft.users)} کاربر اضافه · ${cloudMoney(cloudDraft.storage)} گیگابایت فضای اضافه</p><button type="button" class="secondary" data-cloud-extras>${cloudExtras()?'ویرایش خدمات اضافه':'افزودن خدمات اضافه'}</button></div><div class="purchase-fields">${cloudRead('مبلغ خدمات اضافه (ریال)',cloudMoney(cloudExtras()))}${cloudRead('ظرفیت نهایی کاربران',cloudMoney(Number(p.users)+cloudDraft.users))}${cloudRead('فضای نهایی (گیگابایت)',cloudMoney(Number(p.storage)+cloudDraft.storage))}</div><p class="cloud-rate-note">تعرفه‌های خدمات اضافه در این پیش‌نمایش مطابق تصویر نمونه هستند؛ مبلغ نهایی باید توسط سامانه فروش تأیید شود.</p></fieldset><div class="purchase-fields">${cloudRead('جمع پلن و خدمات اضافه (ریال)',cloudMoney(cloudBase()+cloudExtras()))}${cloudRead('مبلغ تخفیف','پس از بررسی کد تخفیف')}${cloudRead('مالیات و عوارض','پس از محاسبه در سامانه فروش')}</div><div class="purchase-total">${cloudRead('مبلغ نهایی قابل پرداخت','پس از تأیید تعرفه، تخفیف و مالیات')}</div><div class="purchase-consent"><label><input type="checkbox" name="cloud-terms" required ${cloudDraft.terms?'checked':''}> با شرایط و قوانین موافقم</label><button type="button" class="purchase-terms-link" data-open-terms aria-haspopup="dialog">مشاهده قوانین و مقررات</button></div><div class="purchase-actions"><button type="button" class="secondary" data-view="cloud-buy">بازگشت به انتخاب پلن</button><button class="primary">ثبت سفارش</button></div><p class="purchase-feedback" role="status"></p></form>`:'<div class="purchase-start"><p>برای نمایش فرم فاکتور، نوع خریدار را انتخاب کنید.</p></div>'}</div>`;
};
function cloudExtraSection(kind,title,label,rate,value){return `<fieldset><legend>${title}</legend><div class="purchase-fields"><label>${label}<input name="${kind}" type="number" min="0" max="10000" step="1" required value="${value}"></label>${cloudRead('بهای واحد (ریال؛ تعرفه نمونه)',cloudMoney(rate))}<label>جمع کل (ریال)<input readonly data-extra-gross="${kind}" value="${cloudMoney(rate*value)}"></label>${cloudRead('درصد تخفیف','۰')}${cloudRead('مبلغ تخفیف (ریال)','۰')}<label>مبلغ نهایی (ریال)<input readonly data-extra-net="${kind}" value="${cloudMoney(rate*value)}"></label></div></fieldset>`;}
function openCloudExtras(){
 let modal=document.getElementById('cloud-extras-dialog');
 if(!modal){document.body.insertAdjacentHTML('beforeend','<dialog id="cloud-extras-dialog" aria-labelledby="cloud-extras-title"></dialog>');modal=document.getElementById('cloud-extras-dialog');}
 modal.innerHTML=`<div class="cloud-modal-heading"><h2 id="cloud-extras-title">خدمات مازاد</h2><button type="button" data-close-cloud-extras aria-label="بستن">×</button></div><form class="purchase-form" data-form="cloud-extras">${cloudExtraSection('extra-users','افزودن کاربر','تعداد کاربر اضافه',47808,cloudDraft.users)}${cloudExtraSection('extra-storage','افزودن فضای ذخیره‌سازی','فضای اضافه (گیگابایت)',9562,cloudDraft.storage)}<p class="cloud-rate-note">تعرفه نمونه برای دوره پلن منتخب: کاربر ۴۷٬۸۰۸ و هر گیگابایت ۹٬۵۶۲ ریال. قیمت واقعی و تناسب با مدت سرویس پس از اتصال به فروش تعیین می‌شود.</p><div class="extras-grand-total">مبلغ کل خدمات اضافه: <strong data-extra-total>${cloudMoney(cloudExtras())}</strong> ریال</div><div class="purchase-actions"><button type="button" class="secondary" data-close-cloud-extras>بازگشت به صفحه قبل</button><button class="primary">تأیید و ادامه</button></div></form>`;
 modal.showModal();
}
document.addEventListener('click',event=>{
 const choice=event.target.closest('[data-cloud-plan]');
 if(choice){cloudDraft.plan=Number(choice.dataset.cloudPlan);cloudDraft.terms=false;location.hash='cloud-checkout';return;}
 if(event.target.closest('[data-cloud-extras]'))openCloudExtras();
 if(event.target.closest('[data-close-cloud-extras]'))document.getElementById('cloud-extras-dialog').close();
});
document.addEventListener('change',event=>{if(event.target.name==='cloud-buyer'){cloudDraft.type=event.target.value;cloudDraft.terms=false;render('cloud-checkout');}});
document.addEventListener('input',event=>{
 if(event.target.name==='cloud-discount')cloudDraft.discount=event.target.value;
 if(event.target.name==='cloud-terms')cloudDraft.terms=event.target.checked;
 const form=event.target.closest('[data-form="cloud-extras"]');if(!form)return;
 let total=0;
 for(const [name,rate] of [['extra-users',47808],['extra-storage',9562]]){
  const field=form.elements.namedItem(name);const value=field.validity.valid?Number(field.value):0;const sum=value*rate;total+=sum;
  form.querySelector(`[data-extra-gross="${name}"]`).value=cloudMoney(sum);form.querySelector(`[data-extra-net="${name}"]`).value=cloudMoney(sum);
 }
 form.querySelector('[data-extra-total]').textContent=cloudMoney(total);
});
document.addEventListener('submit',event=>{
 const form=event.target;
 if(form.dataset.form==='cloud-extras'){
  event.preventDefault();if(!form.reportValidity())return;
  cloudDraft.users=Number(form.elements.namedItem('extra-users').value);cloudDraft.storage=Number(form.elements.namedItem('extra-storage').value);
  document.getElementById('cloud-extras-dialog').close();render('cloud-checkout');
 }
 if(form.dataset.form==='cloud-checkout'){
  event.preventDefault();const names=cloudDraft.type==='individual'?['first','last','national']:['company','legalId','registration','economic'];
  const complete=names.every(name=>String(profiles[cloudDraft.type]?.[name]||'').trim());
  form.querySelector('.purchase-feedback').textContent=complete?'اطلاعات فاکتور آماده است؛ ثبت و پرداخت واقعی پس از اتصال به سامانه فروش فعال می‌شود.':'ابتدا مشخصات خریدار را در پروفایل تکمیل و ذخیره کنید.';
 }
});

 return {cloud,type,name:type==='legal'?buyer.company:[buyer.first,buyer.last].filter(Boolean).join(' '),identity:type==='legal'?buyer.legalId:buyer.national,product:cloud?'پارامتر ابری':'پارامتر سازمانی',plan:plan?.name||'اشتراک سازمانی',users:cloud?Number(plan.users)+cloudDraft.users:enterpriseDraft.invoice.users||'1',storage:cloud?Number(plan.storage)+cloudDraft.storage:null,employer:cloud?'':enterpriseDraft.invoice.employer,base:cloud?cloudMoney(cloudBase()):'در انتظار تعیین تعرفه',extras:cloud?cloudMoney(cloudExtras()):'—',subtotal:cloud?cloudMoney(cloudBase()+cloudExtras()):'در انتظار تعیین تعرفه',discount:cloud?cloudDraft.discount:enterpriseDraft.invoice.discount};
}

e="${value}" ${index===0?'checked':''} required><span class="gateway-symbol gateway-${value}" aria-hidden="true">${mark}</span><span><b>${title}</b><small>${subtitle}</small></span><span class="gateway-selected" aria-hidden="true">✓</span></label>`).join('')}</fieldset><p class="payment-preview-note">این صفحه پیش‌نمایش است. مبلغ نهایی و اتصال درگاه پس از تأیید تعرفه، تخفیف و مالیات فعال می‌شود؛ در این مرحله پرداختی انجام نمی‌شود.</p><div class="payment-review-actions"><button type="button" class="secondary" data-payment-close>بازگشت و ویرایش سفارش</button><button type="submit" class="primary">ورود به درگاه بانکی <span aria-hidden="true">←</span></button></div><p class="payment-review-status" role="status"></p></form></div>`;
