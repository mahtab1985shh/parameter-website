<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
@font-face{font-family:Estedad;src:url('fonts-font-4.ttf') format('truetype');font-weight:100 900;font-display:swap}*{box-sizing:border-box}body{margin:0;background:white;color:#302b46;font-family:Estedad,Tahoma,sans-serif}.universe{max-width:1160px;margin:auto;position:relative;background:radial-gradient(ellipse at 50% 44%,#f4effc,transparent 46%)}svg{display:block;width:100%;height:530px;overflow:visible}svg text{font-family:Estedad,Tahoma,sans-serif;text-anchor:middle;fill:#302b46}.ring{fill:none;stroke:#d9d2eb;stroke-width:1;stroke-dasharray:2 9}.wire{fill:none;stroke-width:1.7;stroke-dasharray:1 8;stroke-linecap:round;opacity:.6}.node{cursor:pointer;outline:none}.node:hover .tile,.node:focus .tile,.node[aria-pressed=true] .tile{stroke-width:2.3;filter:drop-shadow(0 5px 9px #78609020)}.tile{stroke-width:1.2}.gem{fill:none;stroke-width:1;opacity:.7;transform-box:fill-box;transform-origin:center;animation:spin 28s linear infinite}.gem.reverse{animation-direction:reverse;animation-duration:38s}.detail{text-align:center;min-height:86px;padding:4px 20px 14px;max-width:650px;margin:auto}.detail strong{font-size:16px;color:#7760ae}.detail p{font-size:13px;line-height:2;color:#81758d;margin:7px 0}.motion{display:block;margin:0 auto 10px;border:0;background:#f7f4fc;border-radius:20px;padding:5px 14px;color:#8c7ba3;font:11px Estedad;cursor:pointer}@keyframes spin{to{transform:rotate(360deg)}}.paused .gem{animation-play-state:paused}@media(max-width:650px){svg{height:470px}.detail{min-height:104px}.detail p{font-size:12px}}@media(prefers-reduced-motion:reduce){.gem{animation:none}.particle{display:none}}
</style><style>svg{height:auto;aspect-ratio:700/660}.universe{max-width:760px}.wire{opacity:.18;stroke-width:1}.ring{stroke-width:1.2;stroke-dasharray:1 7}.detail{min-height:92px}.node{transition:filter .2s}@media(max-width:650px){svg{height:auto}.detail{min-height:110px}}</style></head><body><main class="universe"><svg id="network" role="group" aria-label="ارتباط یکپارچه امکانات با سامانه پارامتر"></svg><div class="detail" aria-live="polite"><strong id="detail-title">یک پروژه؛ یک تصویر مشترک</strong><p id="detail-copy">هر بخش را انتخاب کنید و ارتباط آن با محیط یکپارچهٔ پارامتر را ببینید.</p></div><button class="motion" type="button">توقف حرکت</button></main><script>
const data=[['زمان‌بندی','#f0eaff','#9470e0','برنامه و فعالیت‌های اجرایی در کنار اطلاعات واقعی پروژه قرار می‌گیرند.'],['قراردادها','#fce9f3','#dc80b5','مشخصات پیمان و اسناد مرتبط، در بستر همان پروژه در دسترس هستند.'],['هزینه و منابع','#e5f6f2','#28b6a2','اطلاعات هزینه، مصالح، نیروی انسانی و ماشین‌آلات کنار هم دیده می‌شوند.'],['پیشرفت پروژه','#e8f2ff','#579cde','عملکرد واقعی با برنامه مقایسه می‌شود تا وضعیت پیشرفت روشن باشد.'],['مستندات','#fff3d9','#d9a847','صورت‌جلسه‌ها، گزارش‌ها و اسناد پروژه در محیطی مشترک نگهداری می‌شوند.'],['تحلیل و گزارش','#e6f8fb','#34bac8','داده‌های مرتبط، تصویر مشترکی برای بررسی و تصمیم‌گیری می‌سازند.']];
const svg=document.getElementById('network'),ns='http://www.w3.org/2000/svg';
let paused=matchMedia('(prefers-reduced-motion: reduce)').matches,hovered=false,clock=0,last=0;
function el(tag,attrs={},text){const n=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v));if(text)n.textContent=text;return n}
svg.setAttribute('viewBox','0 0 700 660');const cx=350,cy=330;
const orbits=[{x:cx-5,y:cy+4,rx:153,ry:146,speed:1/56},{x:cx+8,y:cy-5,rx:270,ry:260,speed:-1/84}];
orbits.forEach(o=>{svg.append(el('ellipse',{cx:o.x,cy:o.y,rx:o.rx,ry:o.ry,class:'ring'}));svg.append(el('ellipse',{cx:o.x,cy:o.y,rx:o.rx+10,ry:o.ry+10,class:'ring',opacity:.25}))});
const wires=data.map((d,i)=>{const p=el('path',{class:'wire',stroke:d[2]});svg.append(p);return p});
const particles=data.map(d=>{const p=el('circle',{r:4,fill:d[2],class:'particle'});svg.append(p);return p});
const core=el('g');core.append(el('circle',{cx,cy,r:66,fill:'#f5f0fc',stroke:'#cbbbe8'}));
[0,1].forEach(i=>core.append(el('rect',{x:cx-55-i*6,y:cy-55-i*6,width:110+i*12,height:110+i*12,rx:16,stroke:i?'#b8dce3':'#bca6df',class:i?'gem reverse':'gem'})));
[['#8b6ccc',-14,17],['#38bba2',-3,25],['#589fde',8,33]].forEach(([color,x,ht])=>core.append(el('rect',{x:cx+x,y:cy-37,width:7,height:ht,rx:3,fill:color})));
core.append(el('text',{x:cx,y:cy+22,'font-size':20,'font-weight':600,direction:'ltr'},'Parameter'),el('text',{x:cx,y:cy+42,'font-size':10},'یک محیط مشترک'));svg.append(core);
const icons=['M-9-7h18v17H-9z M-9-2H9 M-5-10v6 M5-10v6','M-7-10H7v20H-7z M-3-5H3 M-3 0H3','M-10 7V0h5v7 M-2 7V-5h5V7 M6 7v-17h5V7','M-10 7l7-8 6 3 8-12 M5-10h6v6','M-10-7h7l4 4h10v13h-21z','M-9 9V-1 M-2 9v-17 M5 9v-11 M-12 12h24'];
const nodes=data.map((d,i)=>{const g=el('g',{class:'node',role:'button',tabindex:0,'aria-label':d[0],'aria-pressed':false});g.append(el('circle',{r:43,fill:d[1],stroke:d[2],class:'tile'}));const icon=el('path',{d:icons[i],stroke:d[2],'stroke-width':1.5,fill:'none',transform:'translate(0,-13)'});g.append(icon);
const parts=d[0].split(' '),text=el('text',{x:0,y:16,'font-size':11,'font-weight':500});if(parts.length>1){text.append(el('tspan',{x:0,dy:0},parts[0]),el('tspan',{x:0,dy:16},parts.slice(1).join(' ')))}else text.textContent=d[0];g.append(text);
function select(){document.getElementById('detail-title').textContent=d[0];document.getElementById('detail-copy').textContent=d[3];nodes.forEach(n=>n.setAttribute('aria-pressed',n===g))}
g.addEventListener('click',select);g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select()}});svg.append(g);return g});
function render(){nodes.forEach((n,i)=>{const o=orbits[i%2],phase=[-100,-24,45,103,186,234][i]*Math.PI/180,a=phase+clock*o.speed*2*Math.PI,x=o.x+o.rx*Math.cos(a),y=o.y+o.ry*Math.sin(a);n.setAttribute('transform','translate('+x+','+y+')');wires[i].setAttribute('d','M '+x+' '+y+' L '+cx+' '+cy);const t=(clock/(4+i*.3)+i*.19)%1;particles[i].setAttribute('cx',x+(cx-x)*t);particles[i].setAttribute('cy',y+(cy-y)*t)})}
function tick(now){if(last&&!paused&&!hovered&&!document.hidden)clock+=Math.min((now-last)/1000,.05);last=now;render();requestAnimationFrame(tick)}
svg.addEventListener('pointerenter',()=>hovered=true);svg.addEventListener('pointerleave',()=>hovered=false);svg.addEventListener('focusin',()=>hovered=true);svg.addEventListener('focusout',()=>hovered=false);
function sync(){document.body.classList.toggle('paused',paused);document.querySelector('.motion').textContent=paused?'پخش حرکت':'توقف حرکت'}document.querySelector('.motion').onclick=()=>{paused=!paused;sync()};render();sync();requestAnimationFrame(tick);
</script></body></html>
